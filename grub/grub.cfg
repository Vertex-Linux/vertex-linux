insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
insmod font

set default="0"
set timeout=4

if loadfont "${prefix}/fonts/unicode.pf2"; then
    set gfxmode="auto"
    terminal_input  console
    terminal_output gfxterm
fi

menuentry "Vertex Linux x86_64" --class vertex --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux  /vertex/boot/x86_64/vmlinuz-linux \
           archisobasedir=vertex \
           archisolabel=%ARCHISO_LABEL% \
           quiet splash \
           rd.udev.log_priority=3 \
           vt.global_cursor_default=0
    initrd /vertex/boot/x86_64/initramfs-linux.img
}

menuentry "Vertex Linux x86_64 (copy to RAM)" --class vertex --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux  /vertex/boot/x86_64/vmlinuz-linux \
           archisobasedir=vertex \
           archisolabel=%ARCHISO_LABEL% \
           copytoram \
           quiet splash \
           rd.udev.log_priority=3 \
           vt.global_cursor_default=0
    initrd /vertex/boot/x86_64/initramfs-linux.img
}

menuentry "EFI Shell" {
    insmod chain
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    chainloader /shellx64.efi
}
