---
dontChroot: false
timeout: 600
script:
    # Copy kernel (mkarchiso wipes /boot from squashfs before packing)
    - "cp /proc/1/root/run/archiso/bootmnt/vertex/boot/x86_64/vmlinuz-linux /boot/vmlinuz-linux"
    # Replace the archiso-only preset with the standard default+fallback preset
    - "rm -f /etc/mkinitcpio.conf.d/archiso.conf"
    - "echo \"PRESETS=('default' 'fallback')\" > /etc/mkinitcpio.d/linux.preset"
    - "echo 'ALL_kver=/boot/vmlinuz-linux' >> /etc/mkinitcpio.d/linux.preset"
    - "echo 'default_config=/etc/mkinitcpio.conf' >> /etc/mkinitcpio.d/linux.preset"
    - "echo 'default_image=/boot/initramfs-linux.img' >> /etc/mkinitcpio.d/linux.preset"
    - "echo 'fallback_config=/etc/mkinitcpio.conf' >> /etc/mkinitcpio.d/linux.preset"
    - "echo 'fallback_image=/boot/initramfs-linux-fallback.img' >> /etc/mkinitcpio.d/linux.preset"
    - "echo 'fallback_options=--fallback' >> /etc/mkinitcpio.d/linux.preset"
    - "/usr/bin/mkinitcpio -P"
