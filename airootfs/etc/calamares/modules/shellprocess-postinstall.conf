---
# Runs in the LIVE system so grub-probe sees real block devices.
# Handles kernel copy, mkinitcpio, grub-install, and grub.cfg in one step.
# Logs to /tmp/vertex-postinstall.log on the live system for inspection.
dontChroot: true
timeout: 600
script:
    - "/usr/bin/bash /usr/local/bin/vertex-postinstall"
