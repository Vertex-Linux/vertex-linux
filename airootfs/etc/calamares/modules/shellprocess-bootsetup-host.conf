---
# dontChroot: true — runs in the live archiso system, not the target chroot.
# This is intentional: grub-install needs grub-probe to work, and grub-probe
# only works correctly in the live environment where /proc/mounts is real.
dontChroot: true
timeout: 300
script:
    - "/usr/bin/bash /usr/local/bin/vertex-bootsetup-host"
