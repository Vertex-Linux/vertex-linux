---
# Runs inside the installed system chroot AFTER the bootloader module.
# The bootloader module installs GRUB to MBR correctly (--force bypasses
# grub-probe chroot issues), but grub-mkconfig produces a broken grub.cfg
# with no kernel entries. This shellprocess overwrites it with a working one.
dontChroot: true
timeout: 60
script:
    - "/usr/bin/bash /usr/local/bin/vertex-grubcfg"
