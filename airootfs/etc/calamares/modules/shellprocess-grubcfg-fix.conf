---
dontChroot: false
timeout: 120
script:
    - "awk '$2==\"/\"&&$1~/^UUID=/{gsub(/^UUID=/,\"\",$1);print $1;exit}' /etc/fstab > /tmp/vertex_uuid"
    - "UUID=$(cat /tmp/vertex_uuid) && printf 'set timeout_style=menu\\nset timeout=5\\nset default=0\\n\\ninsmod part_msdos\\ninsmod ext2\\ninsmod gzio\\n\\nsearch --no-floppy --fs-uuid --set=root %s\\n\\nmenuentry \"Vertex Linux\" {\\n    linux  /boot/vmlinuz-linux root=UUID=%s rw quiet loglevel=3\\n    initrd /boot/initramfs-linux.img\\n}\\n\\nmenuentry \"Vertex Linux (fallback initramfs)\" {\\n    linux  /boot/vmlinuz-linux root=UUID=%s rw quiet loglevel=3\\n    initrd /boot/initramfs-linux-fallback.img\\n}\\n' \"$UUID\" \"$UUID\" \"$UUID\" > /boot/grub/grub.cfg"
