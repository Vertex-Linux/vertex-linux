---
# Source is the squashfs produced by mkarchiso (install_dir=vertex).
# If you switch profiledef.sh to erofs, change sourcefs to "erofs"
# and the filename extension to .erofs.
unpack:
    -   source: "/run/archiso/bootmnt/vertex/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
