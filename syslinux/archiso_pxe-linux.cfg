LABEL arch64pxe
TEXT HELP
Vertex Linux x86_64 – PXE (NFS)
ENDTEXT
MENU LABEL Vertex Linux x86_64 (PXE/NFS)
LINUX    /vertex/boot/x86_64/vmlinuz-linux
INITRD   /vertex/boot/x86_64/initramfs-linux.img
APPEND   archisobasedir=vertex archisosearchuuid=%ARCHISO_UUID% quiet splash rd.udev.log_priority=3 vt.global_cursor_default=0

LABEL arch64pxehttp
TEXT HELP
Vertex Linux x86_64 – PXE (HTTP)
ENDTEXT
MENU LABEL Vertex Linux x86_64 (PXE/HTTP)
LINUX    /vertex/boot/x86_64/vmlinuz-linux
INITRD   /vertex/boot/x86_64/initramfs-linux.img
APPEND   archisobasedir=vertex archisosearchuuid=%ARCHISO_UUID% archiso_http_srv=http://%ARCHISO_HOST%/ quiet splash rd.udev.log_priority=3 vt.global_cursor_default=0
